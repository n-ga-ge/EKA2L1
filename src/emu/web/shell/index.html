<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EKA2L1 Web</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <div id="status" role="status" aria-live="polite">Loading…</div>
    <div id="actions">
      <button id="btn-pause" type="button" title="Pause" disabled>Pause</button>
      <button id="btn-restart" type="button" title="Restart the game" disabled>Restart</button>
      <button id="btn-mute" type="button" title="Mute" disabled>Mute</button>
      <button id="btn-keypad" type="button" title="Show the number keys" class="touch-only">123</button>
      <button id="btn-fullscreen" type="button" title="Fullscreen">Full</button>
      <button id="btn-info" type="button" title="Diagnostics">Info</button>
    </div>
  </header>

  <main id="console">
    <div class="pad pad-left touch-only" aria-label="Direction controls">
      <button type="button" class="key soft" data-key="lsk">◧</button>
      <div id="dpad" class="dpad"><span></span></div>
    </div>

    <div id="stage">
      <canvas id="canvas" width="528" height="624" tabindex="0"></canvas>
      <div id="overlay" hidden></div>
    </div>

    <div class="pad pad-right touch-only" aria-label="Action controls">
      <button type="button" class="key soft" data-key="rsk">◨</button>
      <div class="actions-cluster">
        <button type="button" class="key round" data-key="7">7</button>
        <button type="button" class="key round primary" data-key="ok">OK</button>
        <button type="button" class="key round" data-key="5">5</button>
        <button type="button" class="key round" data-key="clear">C</button>
      </div>
    </div>
  </main>

  <div id="keypad" class="touch-only" hidden>
    <button type="button" class="key" data-key="1">1</button><button type="button" class="key" data-key="2">2</button><button type="button" class="key" data-key="3">3</button>
    <button type="button" class="key" data-key="4">4</button><button type="button" class="key" data-key="5">5</button><button type="button" class="key" data-key="6">6</button>
    <button type="button" class="key" data-key="7">7</button><button type="button" class="key" data-key="8">8</button><button type="button" class="key" data-key="9">9</button>
    <button type="button" class="key" data-key="star">✱</button><button type="button" class="key" data-key="0">0</button><button type="button" class="key" data-key="hash">#</button>
  </div>

  <form id="setup" hidden>
    <label id="fw-row">N-Gage firmware (ROM dump) <input id="fw-file" type="file"></label>
    <label>Game card dump (.zip) <input id="game-file" type="file" accept=".zip,.7z,.rar"></label>
    <button id="start" type="submit">Start</button>
  </form>

  <p id="help" class="desktop-only">Arrows move · <kbd>Enter</kbd> OK · <kbd>Q</kbd>/<kbd>W</kbd> soft keys · <kbd>0</kbd>–<kbd>9</kbd> keypad · <kbd>-</kbd> ✱ · <kbd>=</kbd> # · <kbd>Backspace</kbd> clear · gamepads supported</p>

  <dialog id="info">
    <h2>Diagnostics</h2>
    <div id="info-body"></div>
    <form method="dialog"><button type="submit">Close</button></form>
  </dialog>

  <script src="eka2l1_web.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
