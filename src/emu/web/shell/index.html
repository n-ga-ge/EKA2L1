<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKA2L1 Web</title>
<style>
  :root { color-scheme: dark; --bg: #111316; --panel: #1b1e23; --text: #e6e8eb; --muted: #9aa1ab; --accent: #6cb4ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  #stage { position: relative; background: #000; border-radius: 6px; overflow: hidden; }
  canvas { display: block; height: min(78vh, 624px); aspect-ratio: 176 / 208; image-rendering: pixelated; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             text-align: center; padding: 16px; background: rgba(0, 0, 0, .72); }
  #overlay[hidden] { display: none; }
  #status { color: var(--muted); min-height: 1.4em; text-align: center; max-width: 60ch; }
  #setup { background: var(--panel); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; max-width: 46ch; }
  #setup[hidden] { display: none; }
  label { display: grid; gap: 4px; color: var(--muted); }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 0; background: var(--accent); color: #06121f; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  kbd { background: var(--panel); border-radius: 4px; padding: 1px 5px; }
  #help { color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" width="528" height="624" tabindex="0"></canvas>
    <div id="overlay" hidden></div>
  </div>
  <div id="status">Loading…</div>
  <form id="setup" hidden>
    <label>N-Gage firmware (ROM dump) <input id="fw-file" type="file"></label>
    <label>Game card dump (.zip) <input id="game-file" type="file" accept=".zip,.7z,.rar"></label>
    <button id="start" type="submit">Start</button>
  </form>
  <div id="help">Arrows move · <kbd>Enter</kbd> OK · <kbd>Q</kbd>/<kbd>W</kbd> soft keys · <kbd>0</kbd>–<kbd>9</kbd> keypad · <kbd>-</kbd> ✱ · <kbd>=</kbd> # · <kbd>Backspace</kbd> clear</div>
  <script src="eka2l1_web.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
